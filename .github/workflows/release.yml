name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  # ── Build native macOS arm64 binary ───────────────────────────
  #
  # The binary EMBEDS the web assets: `web/dist/` is built below before
  # `cargo build`, and `build.rs` emits `web_embedded` so `include_dir!`
  # bakes the SPA into the executable. No first-run download — the tarball
  # is the sole artifact for this release.
  binary:
    name: Build macOS arm64 binary
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Use system bun
        run: which bun && bun --version
      - name: Build web assets
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - name: Build dist binary
        run: cargo build --profile dist --locked
      - name: Smoke test
        run: ./target/dist/oxios --version
      - name: Package and checksum
        run: |
          set -euo pipefail
          ASSET=oxios-aarch64-apple-darwin.tar.gz
          tar -C target/dist -czf "$ASSET" oxios
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          ls -lh "$ASSET" "$ASSET.sha256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            oxios-aarch64-apple-darwin.tar.gz
            oxios-aarch64-apple-darwin.tar.gz.sha256
          generate_release_notes: true

  # ── Trigger crates.io publish ──────────────────────────────────
  # A Release created with GITHUB_TOKEN does NOT emit a `release: published`
  # event to other workflows (GitHub suppresses this to prevent loops), so
  # publish.yml's `on: release` trigger never fires. Dispatch it explicitly
  # here once the Release is live. publish.yml verifies the Release exists
  # before publishing.
  trigger-publish:
    name: Trigger crates.io publish
    needs: binary
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml -f dry_run=false
          echo "publish.yml dispatched for $GITHUB_REF_NAME"

  # ── Bump Homebrew tap ──────────────────────────────────────────
  # Rewrites url/sha256 in project-oxi/homebrew-tap Formula/oxios.rb
  # so `brew upgrade oxios` picks up this release. TAP_GH_TOKEN is a
  # PAT with Contents:RW on the tap repo (GITHUB_TOKEN cannot push
  # across repositories).
  bump-tap:
    name: Bump Homebrew tap
    needs: binary
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Update tap formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_GH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "::add-mask::$TAP_TOKEN"
          TAG="${VERSION#v}"
          URL="https://github.com/project-oxi/oxios/releases/download/${VERSION}/oxios-aarch64-apple-darwin.tar.gz"
          SHA=$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/project-oxi/homebrew-tap.git" tap
          cd tap
          sed -i '' -E \
            -e "s|url \".*\"|url \"${URL}\"|" \
            -e "s|sha256 \".*\"|sha256 \"${SHA}\"|" \
            Formula/oxios.rb
          git config user.name "oxios-release-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -am "oxios ${TAG}"
          git push
