[package]
name = "oxios"
version = "1.41.0"
edition = "2024"
description = "Oxios Agent OS — Agent Operating System powered by oxicode-sdk"
license = "MIT"
include = [
    # Source — Rust
    "/src/**/*.rs",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/.cargo/config.toml",
    # Built web UI — embedded via include_dir! (build.rs emits cfg when present)
    "/web/dist/**",
    # Default skills, config template
    "/share/**",
    # Docs
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
    "/CHANGELOG.md",
]
repository = "https://github.com/project-oxi/oxios"
readme = "README.md"
keywords = ["agent", "ai", "os", "automation"]
categories = ["command-line-utilities", "asynchronous"]

# Dev profile: dependencies at opt-level 1 for a good compile/runtime
# balance. opt-level 2 (previously used) added significant LLVM pass
# time on every clean build and cargo check without proportional
# runtime benefit during development.
[profile.dev.package."*"]
opt-level = 1

# Release profile — for `cargo build --release`. Optimized for fast
# *compilation* while still producing a good binary: 16 codegen units
# parallelize LLVM, no LTO skips the expensive cross-crate pass.
[profile.release]
codegen-units = 16
opt-level = 3
strip = true
panic = "abort"

# Dist profile — for final binary distribution (`cargo build --profile dist`).
# Inherits release defaults, then adds maximum optimization:
#   lto = "thin"  — cross-crate optimization (~15-25% size reduction)
#   codegen-units = 1 — single translation unit for best inlining
#   strip         — remove debug symbols
#   panic = abort — smaller binary (we don't use catch_unwind)
# See docs/production-audit/07-infra/RELEASE-PROFILE.md for trade-off analysis.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[workspace]
# RFC-026: Removed surface/oxios-web, channels/oxios-cli, channels/oxios-telegram.
# Their code lives in src/api/, src/channels/cli/, src/channels/telegram/ as modules.
members = [
    "crates/oxios-mcp",
    "crates/oxios-calendar",
    "crates/oxios-kernel",
    "crates/oxios-markdown",
    "crates/oxios-ouroboros",
    "crates/oxios-gateway",
]

[workspace.lints.rust]
# Public API must be documented. Every crate already satisfies this today
# (0 violations); enforced centrally here so new `pub` items stay documented.
missing_docs = "warn"

[workspace.lints.clippy]
# Panics are a runtime hazard. Bare `.unwrap()` is discouraged outside tests:
# use `?` for fallible operations, or `.expect("reason")` for a documented
# infallible case. `expect_used` is intentionally left at `allow` so that
# intentional, explained panics stay ergonomic.
unwrap_used = "warn"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography / hashing
sha2 = "0.10"
blake3 = "1.8"
hex = "0.4"
getrandom = "0.2"
regex = "1"

# Concurrency
parking_lot = "0.12"
arc-swap = "1.7"


# Brain daemon client (RFC-047)
oxibrain-client = "0.2"
# 0.73.0: oxicode-sdk 0.72 dropped browsing re-exports (BrowseTool/BrowseSessionTool
# factories + browser/native-browser features). 0.73.0 added BrowseProgress::PdfExported.
# oxibrowser-core is a direct dep — products own browsing themselves (RFC-046).
oxicode-sdk = { version = "0.73.0", features = ["delegation", "circuit-breaker", "router"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Archive
zip = "2"
flate2 = "1"
tar = "0.4"

# File system paths
dirs = "6"

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

# CLI / interactive
inquire = "0.9"
console = "0.15"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"

# Temp files
tempfile = "3"

# Once init
once_cell = "1.19"

# Web/API (RFC-026: moved from surface/oxios-web)
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-full"] }

mime_guess = "2"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
proptest = "1"
# CLI channel (RFC-026: moved from channels/oxios-cli)
reedline = "0.38"

qrcode = "0.14"
# Remote companion surface (RFC-044)
snow = "0.10"
tokio-tungstenite = "0.24"
base64 = "0.22"
local-ip-address = "0.6"
hostname = "0.4"
# Foundation Keychain (RFC-048) — used by the kernel when the
# `foundation-keychain` feature is enabled. Optional everywhere; the
# default build never pulls the native dependencies.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }

[features]
default = ["web", "cli", "browser", "screenshot"]
# web: HTTP API server (Axum). Source: src/api/ (merged from surface/oxios-web per RFC-026)


web = ["dep:axum", "dep:tower", "dep:tower-http",
       "dep:mime_guess", "dep:futures-util", "dep:tokio-stream",
       "dep:utoipa", "dep:utoipa-swagger-ui"]
# cli: interactive terminal channel. Source: src/channels/cli/ (merged from channels/oxios-cli per RFC-026)
cli = ["dep:reedline"]
# telegram: Telegram bot channel. Source: src/channels/telegram/ (merged from channels/oxios-telegram per RFC-026)
telegram = []


browser = ["oxios-kernel/browser"]
# screenshot: now part of the unified `browser` feature (RFC-046).
# Kept as alias for backward compatibility with feature flags.
screenshot = ["oxios-kernel/browser"]
embedding-gguf = ["oxios-kernel/embedding-gguf"]
# First-party app modules (opt-in, default-off). See
# docs/designs/2026-08-05-app-module-integration-design.md
memo = ["oxios-kernel/memo"]
timeline = ["oxios-kernel/timeline"]

# remote: E2EE companion surface (RFC-044). Opt-in — not in default.
remote = ["dep:snow", "dep:tokio-tungstenite", "dep:base64", "dep:qrcode", "dep:local-ip-address", "dep:hostname"]

[dependencies]
oxios-kernel = { version = "1.40.0", path = "crates/oxios-kernel", default-features = false }
oxios-calendar = { version = "1.40.0", path = "crates/oxios-calendar" }
oxios-markdown = { version = "1.40.0", path = "crates/oxios-markdown" }
oxios-ouroboros = { version = "1.40.0", path = "crates/oxios-ouroboros" }
oxios-gateway = { version = "1.40.0", path = "crates/oxios-gateway" }
oxicode-sdk = { workspace = true }

# RFC-026: optional deps gated by features (were separate crates)
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

mime_guess = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
utoipa-swagger-ui = { workspace = true, optional = true }
reedline = { workspace = true, optional = true }

hex = { workspace = true }
getrandom = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
parking_lot = { workspace = true }
tracing-appender = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
inquire = { workspace = true }
libc = { workspace = true }
console = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
indicatif = "0.17"
clap_complete = "4"
webbrowser = "1.0"
reqwest = { workspace = true }
zip = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
toml_edit = "0.22"
include_dir = "0.7"

# oxibrowser 0.21 — search-only at the binary level. The headless engine lives
# in oxios-kernel's `browser` feature via the direct oxibrowser-core 0.21 dep.
# 0.21 adds Tab::print_to_pdf + WebAssembly support (wasmi ↔ boa_engine bridge).
oxibrowser = "0.21"
oxibrain-client = { workspace = true }

snow = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
local-ip-address = { workspace = true, optional = true }
hostname = { workspace = true, optional = true }

[dev-dependencies]
oxios-ouroboros = { version = "1.40.0", path = "crates/oxios-ouroboros" }
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "remote_probe"
# Skip this example unless the `remote` feature is on. The example is a
# paired-client smoke probe; it depends on `tokio-tungstenite` and `snow`
# which are only present with `remote`. Without this, the default build
# (`cargo test -p oxios`) tries to compile the example with no `remote`
# feature and cargo errors E0601 because the cfg-gated `main()` is
# stripped. `required-features` makes cargo skip the example entirely.
required-features = ["remote"]

[patch.crates-io]
oxios-kernel = { path = "crates/oxios-kernel" }
# Uncomment for local development against oxicode/oxibrowser:
# oxicode-ai = { path = "/Volumes/MERCURY/PROJECTS/oxicode/oxicode-ai" }
# oxicode-agent = { path = "/Volumes/MERCURY/PROJECTS/oxicode/oxicode-agent" }
# oxibrowser = { path = "/Volumes/MERCURY/PROJECTS/oxibrowser/crates/oxibrowser" }


[lints]
workspace = true
