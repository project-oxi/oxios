[package]
name = "oxios-kernel"
version = "1.38.1"
edition = "2024"
description = "Oxios kernel: supervisor, event bus, state store"
license = "MIT"
repository = "https://github.com/project-oxi/oxios"

[features]
default = ["sqlite-memory"]
wasm-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Unified browser feature — browse tools + screenshot, both via oxibrowser-core 0.20.
# Replaces the former `native-browser` (SDK-dependent) and `screenshot` (standalone)
# features with a single direct dependency on oxibrowser-core.
browser = ["dep:oxibrowser-core"]
sqlite-memory = ["dep:rusqlite", "dep:sqlite-vec", "oxios-memory/sqlite-memory"]

# MLX embedding provider (Apple Silicon only)
# Provides EmbeddingGemma-300m dense vectors for semantic search.
# When disabled, falls back to TF-IDF sparse embeddings.
embedding-gguf = ["dep:llama-gguf", "dep:hf-hub"]

# First-party app modules (opt-in, default-off). Embed a sibling app's core
# library so oxios agents access its data via typed Rust APIs (no CLI
# shell-out). Activated at runtime via the `[memo]` / `[timeline]` config
# sections. The core crates are siblings (not yet on crates.io); paths are
# used locally, versions recorded for a future crates.io publish.
# See docs/designs/2026-08-05-app-module-integration-design.md
memo = ["dep:oximemo-core"]
timeline = ["dep:oxiline-core", "dep:rusqlite"]

[dependencies]
oxios-ouroboros = { version = "1.38.1", path = "../oxios-ouroboros" }
oxios-markdown = { version = "1.38.1", path = "../oxios-markdown" }
oxios-calendar = { version = "1.38.1", path = "../oxios-calendar" }
oxios-mcp = { version = "1.38.1", path = "../oxios-mcp" }
oxios-memory = { version = "1.38.1", path = "../oxios-memory" }
oxicode-sdk = { workspace = true }
oxicode-agent = "0.66.0"
# oxicode-ai — needed for ContentBlock/ImageContent in browse tool screenshots.
# The SDK re-exports ContentBlock but not ImageContent, so we depend directly.
oxicode-ai = "0.66.0"
# First-party app module cores (optional, opt-in via the `memo`/`timeline`
# features). Published to crates.io; resolved from the registry.
oximemo-core = { version = "0.7", optional = true }
oxiline-core = { version = "0.3", optional = true }
# oxibrowser-core 0.20 — direct dependency for browse tools + screenshot.
# Behind the unified `browser` feature (RFC-046). Replaces the former SDK
# browser port (oxicode-sdk's `browser`/`native-browser` features).
oxibrowser-core = { version = "0.20", optional = true }
# serde_yaml — YAML parsing (skill frontmatter + BrowseScriptTool steps).
serde_yaml = "0.9"
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
cron = "0.16"

regex = { workspace = true }
gix = { version = "0.83", features = ["tree-editor", "blob-diff"] }
similar = "2"
toml = { workspace = true }
glob = "0.3"
tempfile = { workspace = true }
lettre = { workspace = true }
# HTTP client for ClawHub API
reqwest = { workspace = true }
# Base64 decoding for image generation (b64_json response normalization)
base64 = "0.22"
# ZIP extraction for ClawHub skill archives
zip = { workspace = true }
# tar.gz extraction for host-tool downloads (RFC-041 provisioner)
flate2 = { workspace = true }
tar = { workspace = true }
# URL parsing
url = "2.5"
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
once_cell = { workspace = true }
blake3 = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
wasmtime = { version = "36.0.13", features = ["cranelift"], optional = true }
wasmtime-wasi = { version = "36.0.13", optional = true }
sysinfo = "0.35"
dirs = { workspace = true }
libc = { workspace = true }
inquire = { workspace = true }
console = { workspace = true }
indicatif = "0.17"

# SQLite-based memory storage (RFC-012)
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
sqlite-vec = { version = "0.1", optional = true }

# MLX embedding (Apple Silicon, optional)
[target.'cfg(target_arch = "aarch64")'.dependencies]
llama-gguf = { version = "0.14", optional = true, features = ["cpu", "huggingface"] }
hf-hub = { version = "0.4", optional = true }



[dev-dependencies]
tempfile = { workspace = true }
lettre = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

 criterion = { version = "0.5", features = ["async"] }

[lints]
workspace = true
