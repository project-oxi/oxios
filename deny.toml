# cargo-deny configuration — audit F-7.
#
# Run with: `cargo deny check` (advisories, licenses, bans).
# This file is consulted by `cargo deny`; it does not replace
# `.cargo/audit.toml` (which is read by `cargo audit`).

# Cargo-deny 0.20 uses scopes for informational advisories.
[advisories]
unmaintained = "transitive"
unsound = "transitive"
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "No upstream constant-time fix; transitive via oxicode-ai." },
    { id = "RUSTSEC-2025-0119", reason = "Unmaintained transitive dependency owned by upstream." },
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained transitive dependency owned by upstream." },
    { id = "RUSTSEC-2026-0192", reason = "Unmaintained transitive dependency owned by upstream." },
    { id = "RUSTSEC-2025-0141", reason = "Unmaintained transitive (build) dependency of azul-layout via hyphenation; pinned by oxibrowser-render (oxicode-sdk), no in-repo fix." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; transitive via usvg -> blitz (oxibrowser-render, oxicode-sdk), no in-repo fix." },
    { id = "RUSTSEC-2026-0253", reason = "lru pop() panic-safety UAF (INFO unsound); transitive via azul-layout (oxibrowser-render), fix (lru >= 0.18.2) unreachable through the pinned graph; requires oxicode-sdk bump." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "NCSA",
    "Unlicense",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.8

# Duplicate versions are currently transitive and managed by upstream crates.
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
